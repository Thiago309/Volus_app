server {
    listen 80;
    server_name localhost;

    # Localização da build estática do Flutter Web
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Habilitar suporte a roteamento de Single Page Applications (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Exposição de status do Nginx para coleta de métricas do Prometheus Exporter
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        # deny all; # Descomente se quiser restringir a IPs específicos
    }

    # Tratamento de erros
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
